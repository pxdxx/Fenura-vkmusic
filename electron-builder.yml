appId: com.fenura.app
productName: Fenura
copyright: Copyright © 2026 pxdxx
artifactName: Fenura-Setup.${ext}
directories:
  output: dist
  buildResources: build
files:
  - package.json
  - src/**/*
  - "!src/**/*.map"
  # koffi нужен только для убирания рамки окна: берём одну сборку под Windows x64, без исходников и документации.
  - "!node_modules/koffi/{src,vendor,doc}/**"
  - "!node_modules/koffi/build/koffi/!(win32_x64)/**"
asar: true
asarUnpack:
  - "node_modules/koffi/build/koffi/win32_x64/*.node"
compression: maximum
electronLanguages:
  - ru
  - en-US
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Fenura
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  language: "1049"
